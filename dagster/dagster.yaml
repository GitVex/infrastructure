storage:
  postgres:
    postgres_db:
      username: { env: DAGSTER_POSTGRES_USER }
      password: { env: DAGSTER_POSTGRES_PASSWORD }
      hostname: { env: DAGSTER_POSTGRES_HOST }
      db_name: { env: DAGSTER_POSTGRES_DB }
      port: 6442

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 5

# Runs execute as subprocesses of the user_code container: no Docker socket needed.
# Switch to dagster_docker.DockerRunLauncher later if you want a container per run.
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

telemetry:
  enabled: false
